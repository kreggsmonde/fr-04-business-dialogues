name: Daily Video Generator

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Target duration in minutes (default: 20)'
        required: false
        default: '20'
      preview:
        description: 'Preview seconds only (leave empty for full video)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run without publishing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-freefont-ttf
          sudo fc-cache -fv

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        run: |
          DURATION="${{ github.event.inputs.duration || '20' }}"
          PREVIEW_FLAG=""
          if [ -n "${{ github.event.inputs.preview }}" ]; then
            PREVIEW_FLAG="--preview ${{ github.event.inputs.preview }}"
          fi
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python auto_pipeline.py --duration "$DURATION" $PREVIEW_FLAG $DRY_RUN_FLAG

      - name: Commit published videos & history log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_videos.json history.json history.js
          if git diff --staged --quiet; then
            echo "No changes to history files"
          else
            git commit -m "chore: update published videos and history log [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin main || git push origin master
          fi
